services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillist-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: skillist-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    


